<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 最新版本的 Bootstrap 核心 CSS 文件 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">

    <!-- 可选的 Bootstrap 主题文件（一般不用引入） -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css" integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ" crossorigin="anonymous">

    <!-- jQuery (Bootstrap 的所有 JavaScript 插件都依赖 jQuery，所以必须放在前边) -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js" integrity="sha384-nvAa0+6Qg9clwYCGGPpDQLVpLNn0fRaROjHqs13t4Ggj3Ez50XnGQqc/r8MhnRDZ" crossorigin="anonymous"></script>

    <!-- 最新的 Bootstrap 核心 JavaScript 文件 -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js" integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd" crossorigin="anonymous"></script>

    <title>Document</title>
</head>
<body>

    <script type="text/javascript">

        var robotId = 1;

        function requestRobotData(robotId) {
            console.log("request api");
            
            let url = "/robot";
            $.get(url, function(data, status) {
                console.log("data:" + data + "status:" + status);
            
                let res = data.result;

                var taskCellIds = "";
                var showStr = "";
                var fetchStr = "";

                for (let i = 0; i < res.length; i++) {
                    const p = res[i].priority;
                    const t = res[i].targetCellId;
                    const f = res[i].actionType;
                    var tag = ", ";
                    if(i == res.length - 1) {
                        tag = "";
                    }
                    showStr = showStr + p + tag;
                    taskCellIds = taskCellIds + t + tag;
                    fetchStr = fetchStr + f + tag;
                }

                let t = new Date().toLocaleString();
                $("#task").html(showStr);
                $("#cellId").html(taskCellIds);
                $("#time").html(t);
                $("#fetchType").html(fetchStr);

            });
        }

        // 每1秒刷新下小车数据
        setInterval(() => {
            $("#rId").html(robotId);
            requestRobotData(robotId);
        }, 500);

    </script>

    <p>
        小车ID: <label id="rId"></label> <br/>
        时间：<label id="time"></label>
    </p>
    <p>
        任务路径点：<br /><span id="cellId"></span>
    </p>
    <p>
        任务取/放：<br /><span id="fetchType"></span>
    </p>
    <p>
        任务优先级：<br /><span id="task"></span>
    </p>

</body>
</html>
